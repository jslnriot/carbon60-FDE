paths:
  raw_csv: data/cloudnova_invoices.csv
  database: cloudnova.duckdb
  dq_report: docs/dq_report.md
  views_sql: models/views.sql
  catalog: models/catalog.yaml

quality:
  as_of_date: "2026-09-30"
  amount_reconciliation_tolerance_usd: 1.00

query:
  max_rows: 100

pricing_usd_per_seat_month:
  Starter: 49
  Pro: 99
  Enterprise: 299

fx:
  # Deliberate prototype decision: the supplied amounts reconcile to pricing
  # only when local amount is divided by the supplied rate.
  mode: divide
  rates:
    USD: 1.00
    EUR: 1.08
    GBP: 1.27

allowed_values:
  region: [NA, EMEA, APAC, LATAM]
  currency: [USD, EUR, GBP]

normalization:
  plan:
    Starter: [Starter, starter, STARTER, Start, "Tier 1"]
    Pro: [Pro, pro, PRO, Professional, "Tier 2"]
    Enterprise: [Enterprise, enterprise, ENT, "Tier 3"]

  billing_cycle:
    monthly: [monthly, Monthly]
    annual: [annual, Annual, annually, yearly]

  status:
    paid: [paid, Paid, PAID, Complete, completed, success]
    pending: [pending, Pending, PENDING, in_review, awaiting]
    failed: [failed, Failed, FAILED, declined, error]
    refunded: [refunded, Refunded, REFUND, charged_back]
    void: [void, Void, VOID, cancelled, canceled]

  payment_method:
    credit_card: [credit_card, "Credit Card"]
    ach: [ach, ACH]
    wire: [wire, "Wire Transfer"]
    invoice: [invoice]

  churned:
    true: ["true", "TRUE", "Yes", "1", "Y"]
    false: ["false", "FALSE", "No", "0", "N"]

dedup:
  # Highest precedence wins when the same invoice_id still conflicts after
  # exact and normalization-only duplicate removal.
  status_precedence: [refunded, void, failed, pending, paid]
